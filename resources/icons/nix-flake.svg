<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Nix Flake Icon with Nix blue color and black outline -->

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#5277C3"/>

  <!-- Black outline layer -->
  <g fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="32" y1="32" x2="32" y2="8"/>
    <line x1="28" y1="12" x2="32" y2="8"/>
    <line x1="36" y1="12" x2="32" y2="8"/>
    <line x1="32" y1="32" x2="52" y2="20"/>
    <line x1="48" y1="26" x2="52" y2="20"/>
    <line x1="52" y1="26" x2="52" y2="20"/>
    <line x1="32" y1="32" x2="52" y2="44"/>
    <line x1="52" y1="38" x2="52" y2="44"/>
    <line x1="48" y1="38" x2="52" y2="44"/>
    <line x1="32" y1="32" x2="32" y2="56"/>
    <line x1="28" y1="52" x2="32" y2="56"/>
    <line x1="36" y1="52" x2="32" y2="56"/>
    <line x1="32" y1="32" x2="12" y2="44"/>
    <line x1="12" y1="38" x2="12" y2="44"/>
    <line x1="16" y1="38" x2="12" y2="44"/>
    <line x1="32" y1="32" x2="12" y2="20"/>
    <line x1="12" y1="26" x2="12" y2="20"/>
    <line x1="16" y1="26" x2="12" y2="20"/>
  </g>

  <!-- White flake layer -->
  <g fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <line x1="32" y1="32" x2="32" y2="8"/>
    <line x1="28" y1="12" x2="32" y2="8"/>
    <line x1="36" y1="12" x2="32" y2="8"/>
    <line x1="32" y1="32" x2="52" y2="20"/>
    <line x1="48" y1="26" x2="52" y2="20"/>
    <line x1="52" y1="26" x2="52" y2="20"/>
    <line x1="32" y1="32" x2="52" y2="44"/>
    <line x1="52" y1="38" x2="52" y2="44"/>
    <line x1="48" y1="38" x2="52" y2="44"/>
    <line x1="32" y1="32" x2="32" y2="56"/>
    <line x1="28" y1="52" x2="32" y2="56"/>
    <line x1="36" y1="52" x2="32" y2="56"/>
    <line x1="32" y1="32" x2="12" y2="44"/>
    <line x1="12" y1="38" x2="12" y2="44"/>
    <line x1="16" y1="38" x2="12" y2="44"/>
    <line x1="32" y1="32" x2="12" y2="20"/>
    <line x1="12" y1="26" x2="12" y2="20"/>
    <line x1="16" y1="26" x2="12" y2="20"/>
  </g>

  <!-- Center dot with outline -->
  <circle cx="32" cy="32" r="5" fill="#000000"/>
  <circle cx="32" cy="32" r="4" fill="#FFFFFF"/>
</svg>
