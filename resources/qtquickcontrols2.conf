# Draw the UI with KDE's Quick Controls style, so the app matches the rest of
# Plasma. Qt reads this from the app's own resources (:/qtquickcontrols2.conf),
# which means it applies however the app is started - the packaged build, a
# plain cargo run, or devloop - with no environment variable to set.
# QT_QUICK_CONTROLS_STYLE still overrides it.
[Controls]
Style=org.kde.desktop
