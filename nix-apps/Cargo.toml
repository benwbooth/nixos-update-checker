[package]
name = "nix-apps"
version = "0.1.0"
edition = "2021"
description = "The apps manifest (apps.json) of a NixOS flake: nixpkgs, Flatpaks and AppImages, with AppImage update resolution"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
