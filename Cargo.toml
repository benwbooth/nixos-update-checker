[package]
name = "nixos-update-checker"
version = "0.1.0"
edition = "2021"
authors = ["Ben"]
description = "A system tray application that monitors a NixOS flake repository for updates"
license = "MIT"

[dependencies]
cxx = "1.0"
cxx-qt = "0.7"
cxx-qt-lib = { version = "0.7", features = ["qt_full"] }
cxx-qt-lib-extras = "0.7"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
directories = "5.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "process", "time", "sync", "macros"] }
thiserror = "2.0"
chrono = "0.4"
chrono-humanize = "0.2"
chrono-tz = "0.10"
iana-time-zone = "0.1"
libc = "0.2"
serde_json = "1.0"
once_cell = "1.19"
regex = "1"

[build-dependencies]
cxx-qt-build = "0.7"
cc = "1.0"
